{{- if .Values.serviceAccount.create }}

apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: nfs
  name: {{ .Vaules.serviceAccount.name}}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    {{- toYaml .Values.clusterRole.labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"

{{- end }}