apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
      - name: gitea
        image: gitea/gitea:latest
        env:
        # DB type
        - name: GITEA__database__DB_TYPE
          value: postgres
        # DB host
        - name: GITEA__database__HOST
          value: postgres.gitea.svc.cluster.local:80
        # Domain
        - name: GITEA__server__DOMAIN
          value: localhost
        # Root URL
        - name: GITEA__server__ROOT_URL
          value: http://localhost:3000
        # HTTP port
        - name: GITEA__server__HTTP_PORT
          value: "3000"
        # SSH domain
        - name: GITEA__server__SSH_DOMAIN
          value: gitea.home.net
        # SSH port
        - name: GITEA__server__SSH_PORT
          value: "22"
        # DB name
        - name: GITEA__database__NAME
          valueFrom:
            secretKeyRef:
              name: gitea-secrets
              key: gitea__database__name
        # DB user
        - name: GITEA__database__USER
          valueFrom:
            secretKeyRef:
              name: gitea-secrets
              key: gitea__database__user
        # DB password
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-secrets
              key: gitea__database__passwd
        ports:
        - name: http
          containerPort: 3000
        - name: ssh
          containerPort: 22
        volumeMounts:
        - name: gitea-data
          mountPath: /data
      volumes:
      - name: gitea-data
        persistentVolumeClaim:
          claimName: gitea-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  type: LoadBalancer
  selector:
    app: gitea
  ports:
  - name: http
    port: 80
    targetPort: 3000
  - name: ssh
    port: 22
    targetPort: 22
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-nodeport
  namespace: gitea
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30080
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 30022
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-clusterip
  namespace: gitea
spec:
  type: ClusterIP
  selector:
    app: gitea
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: ssh
    port: 22
    targetPort: 22
