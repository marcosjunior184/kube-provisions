name: Update Jellyfin Image

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false
env:
  SRC_IMAGE:  ${{ inputs.src_image  || 'docker.io/linuxserver/jellyfin:latest' }}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: login to registries
        run: |
          set -euo pipefail
          echo "${{ secrets.GITEAPWD }}" | skopeo login gitea.home.net -u "${{ secrets.USERNAME }}" --password-stdin
          echo "${{ secrets.GITEAPWD }}" | crane auth login gitea.home.net -u "${{ secrets.USERNAME }}" --password-stdin

      - name: compare digest (source vs destination)
        id: diff
        run: |
          set -euo pipefail
          SRC_DIGEST=$(crane digest "$SRC_IMAGE" | cut -d: -f2)

          if DEST_RAW=$(crane digest gitea.home.net/dasilvam/jellyfin:26.7.16 2>/tmp/dest.err); then
            DEST_DIGEST=$(echo "$DEST_RAW" | cut -d: -f2)
          else
            if grep -qi 'not found\|manifest unknown\|MANIFEST_UNKNOWN' /tmp/dest.err; then
              DEST_DIGEST=""
              echo "destination does not exist yet"
            else
              echo "failed to query destination:" >&2
              cat /tmp/dest.err >&2
              exit 1
            fi
          fi

          if [ "$SRC_DIGEST" = "$DEST_DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "digest=$SRC_DIGEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan with Trivy
        if: steps.diff.outputs.changed == 'true'
        id: trivy
        run: |
          set -euo pipefail

          # 1. Get JSON for parsing
          trivy image --format json --output trivy.json \
            --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
            "$SRC_IMAGE" || true

          # 2. Get the human-readable table
          trivy image --format table --output trivy-table.txt \
            --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
            "$SRC_IMAGE" || true

          # 3. Counts for the summary embed
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy.json)
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"

          # 4. Build a clean markdown table from the JSON (more compact than the raw table)
          {
            echo "# Trivy scan: $SRC_IMAGE"
            echo ""
            echo "| Severity | CVE | Package | Installed | Fixed | Title |"
            echo "|----------|-----|---------|-----------|-------|-------|"
            jq -r '
              .Results[]?
              | .Target as $target
              | .Vulnerabilities[]?
              | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.Title // "-" | gsub("\\|"; "\\\\|")) |"
            ' trivy.json
          } > trivy-report.md

          # 5. Truncate the report file if it is huge (Discord file upload is fine, but keep it sane)
          head -c 200000 trivy-report.md > trivy-report-truncated.md
          mv trivy-report-truncated.md trivy-report.md

          # 6. Build the embed JSON (summary only)
          EMBED=$(jq -n \
            --arg img "$SRC_IMAGE" \
            --arg crit "$CRITICAL" \
            --arg high "$HIGH" \
            '{
              content: "🛡️ Trivy scan completed",
              embeds: [{
                title: "Trivy Scan Results",
                color: (if ($crit|tonumber) > 0 then 15158332 else 3066993 end),
                fields: [
                  { name: "Image",    value: $img,    inline: false },
                  { name: "Critical", value: $crit,   inline: true },
                  { name: "High",     value: $high,   inline: true }
                ],
                footer: { text: "Full report attached as trivy-report.md" }
              }]
            }')

          # 7. Post as multipart with the file attached
          curl -sf \
            -F "payload_json=$EMBED" \
            -F "files[0]=@trivy-table.txt;type=text/markdown" \
            "${{ secrets.DISCORD_WEBHOOK }}"

          # 8. Fail if any CRITICAL or HIGH
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            exit 1
          fi


