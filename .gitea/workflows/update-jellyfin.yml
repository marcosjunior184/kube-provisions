name: Update Jellyfin Image

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Configure buildah storage
        run: |
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf << 'EOF'
          [storage]
          driver = "vfs"
          runroot = "/tmp/buildah-run"
          graphroot = "/tmp/buildah-storage"
          EOF

      - name: Pull images into buildah
        run: |
          export STORAGE_DRIVER=vfs
          export BUILDAH_ISOLATION=chroot
          buildah pull --policy=ifnewer docker.io/linuxserver/jellyfin:latest
          buildah pull --tls-verify=false --creds "${{ secrets.USERNAME }}:${{ secrets.GITEAPWD }}" gitea.home.net/dasilvam/jellyfin:26.7.16
          buildah images