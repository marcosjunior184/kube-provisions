name: Update Jellyfin Image

on:
  schedule:
    # Run daily at 2:00 AM UTC, or trigger manually
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Install buildah and trivy
        run: |
          sudo apk add --no-cache buildah curl || apk add --no-cache buildah curl

          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

          buildah --version
          trivy --version
      
      - name: login into buildad
        run: |
          buildah --version
          buildah login --tls-verify=false -u "${{ secrets.USERNAME }}" -p "${{ secrets.GITEAPWD }}" gitea.home.net
