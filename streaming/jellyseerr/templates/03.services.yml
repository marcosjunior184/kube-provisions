---
#
# Jellyseer Node Port
#
apiVersion: v1
kind: Service
metadata:
  namespace: streaming
  name: jellyseerr-node
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: NodePort
  selector:
    app: jellyseerr
  ports:
  - port: {{ .Values.pvc.nodePort.port }} # 5055
    targetPort: {{ .Values.pvc.targetPort }} # 5055
    nodePort: {{ .Values.pvc.nodePort.nodePort }} # 31739

---
#
# Jellyseer LoadBalancer
#
apiVersion: v1
kind: Service
metadata:
  namespace: streaming
  name: jellyseerr
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: LoadBalancer
  selector:
    app: jellyseerr
  ports:
  - port: {{ .Values.pvc.LoadBalancer.port }} # 80
    targetPort: {{ .Values.pvc.targetPort }} # 5055
